<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星際閃避 Star Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #0a0a0f;
    color: #e8e8e8;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 24px;
  }
  .game-wrap {
    width: 100%;
    max-width: 420px;
    user-select: none;
    -webkit-user-select: none;
  }
  .game-title {
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 2px;
    letter-spacing: 2px;
    color: #fff;
  }
  .game-subtitle {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-bottom: 8px;
  }
  .game-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
    font-size: 13px;
    color: #999;
  }
  .game-hud b { color: #fff; font-weight: 500; }
  .canvas-wrap {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #222;
    background: #0d0d12;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    touch-action: none;
  }
  .game-btn {
    display: block;
    width: 100%;
    padding: 10px 0;
    margin-top: 10px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a22;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }
  .game-btn:hover { background: #252530; border-color: #444; }
  .game-over {
    text-align: center;
    padding: 10px 0 4px;
    color: #888;
    font-size: 13px;
  }
  .game-over .big { font-size: 32px; font-weight: 500; color: #fff; margin-bottom: 2px; }
  .game-over .label { color: #666; }

  /* 廣告欄 */
  .ad-banner {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px dashed #333;
    border-radius: 8px;
    background: #111118;
    text-align: center;
    color: #555;
    font-size: 12px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ad-banner .ad-label {
    font-size: 10px;
    color: #444;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* 版權聲明 */
  .footer-legal {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #1a1a22;
    font-size: 11px;
    color: #444;
    line-height: 1.7;
    text-align: center;
  }
  .footer-legal a {
    color: #666;
    text-decoration: none;
  }
  .footer-legal a:hover {
    color: #888;
    text-decoration: underline;
  }
  .footer-legal .sep {
    color: #333;
    margin: 0 6px;
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="game-title">🚀 星際閃避</div>
  <div class="game-subtitle">Star Dodge — 躲避隕石，收集星星</div>
  <div class="game-hud">
    <span>分數: <b id="score">0</b></span>
    <span>生命: <b id="lives">❤❤❤</b></span>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="420" height="480"></canvas>
  </div>
  <button class="game-btn" id="btn" onclick="startGame()">開始遊戲</button>
  <div class="game-over" id="over" style="display:none">
    <div class="big" id="final">0</div>
    <div class="label">最終得分</div>
  </div>

  <!-- 廣告欄 -->
  <div class="ad-banner">
    <div>
      <div class="ad-label">Advertisement</div>
      <div>廣告位招租 — 聯繫我們</div>
    </div>
  </div>

  <!-- 版權聲明及法律責任 -->
  <div class="footer-legal">
    <div>© 2026 星際閃避 Star Dodge. 保留所有權利。</div>
    <div>
      <a href="#">版權聲明</a>
      <span class="sep">|</span>
      <a href="#">法律責任</a>
      <span class="sep">|</span>
      <a href="#">隱私政策</a>
    </div>
    <div style="margin-top:4px; color:#333;">本網站內容僅供娛樂用途，作者不承擔任何因使用本網站而產生的法律責任。</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const btn = document.getElementById('btn');
const over = document.getElementById('over');
const finalEl = document.getElementById('final');

const W = 420, H = 480;

let state = 'menu';
let score = 0;
let lives = 3;
let frame = 0;
let ship = { x: W/2, y: H - 60, w: 28, h: 32 };
let meteors = [];
let stars = [];
let particles = [];
let bgStars = [];
let spawnRate = 60;
let speedMult = 1;

for (let i = 0; i < 50; i++) {
  bgStars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() * 1.5 + 0.5,
    a: Math.random() * 0.6 + 0.2
  });
}

function reset() {
  score = 0; lives = 3; frame = 0;
  ship.x = W/2; ship.y = H - 60;
  meteors = []; stars = []; particles = [];
  spawnRate = 60; speedMult = 1;
  scoreEl.textContent = '0';
  livesEl.textContent = '❤❤❤';
  over.style.display = 'none';
  btn.textContent = '重新開始';
}

function startGame() {
  reset();
  state = 'play';
  btn.style.display = 'none';
  loop();
}

function gameOver() {
  state = 'over';
  finalEl.textContent = score;
  over.style.display = 'block';
  btn.style.display = 'block';
  btn.textContent = '再玩一次';
}

let mx = W/2;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mx = (e.clientX - r.left) * (W / r.width);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mx = (e.touches[0].clientX - r.left) * (W / r.width);
}, { passive: false });

function spawnMeteor() {
  const r = 14 + Math.random() * 16;
  const m = {
    x: Math.random() * (W - r * 2) + r,
    y: -r, r: r,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 2 + Math.random() * 2 + speedMult,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.08,
    pts: []
  };
  const n = 7 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const rr = m.r * (0.7 + Math.random() * 0.3);
    m.pts.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr });
  }
  meteors.push(m);
}

function spawnStar() {
  stars.push({
    x: Math.random() * (W - 40) + 20,
    y: -20,
    vy: 1.5 + Math.random() * 1.5,
    rot: Math.random() * Math.PI * 2,
    vr: 0.03
  });
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function dist(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  const flicker = 4 + Math.random() * 6;
  ctx.fillStyle = '#f5a623';
  ctx.beginPath();
  ctx.moveTo(-6, 12);
  ctx.lineTo(0, 12 + flicker);
  ctx.lineTo(6, 12);
  ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(-3, 12);
  ctx.lineTo(0, 12 + flicker * 0.6);
  ctx.lineTo(3, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(-12, 12);
  ctx.lineTo(-6, 10);
  ctx.lineTo(0, 14);
  ctx.lineTo(6, 10);
  ctx.lineTo(12, 12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(0, -2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.fillStyle = '#555';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(m.pts[0].x, m.pts[0].y);
  for (let i = 1; i < m.pts.length; i++) ctx.lineTo(m.pts[i].x, m.pts[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.arc(m.pts[0].x * 0.3, m.pts[0].y * 0.3, m.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const a2 = ((i + 0.5) / 4) * Math.PI * 2 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
    ctx.lineTo(Math.cos(a2) * 4, Math.sin(a2) * 4);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (const s of bgStars) {
    ctx.globalAlpha = s.a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
    ctx.fill();
    if (state === 'play') {
      s.y += 0.3 * speedMult;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
  }
  ctx.globalAlpha = 1;
}

function loop() {
  if (state !== 'play') {
    drawBg();
    drawShip(ship.x, ship.y);
    return;
  }
  frame++;
  if (frame % 300 === 0) {
    spawnRate = Math.max(20, spawnRate - 3);
    speedMult += 0.08;
  }
  if (frame % Math.floor(spawnRate) === 0) spawnMeteor();
  if (frame % 140 === 0) spawnStar();

  ship.x += (mx - ship.x) * 0.12;
  ship.x = Math.max(16, Math.min(W - 16, ship.x));

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx;
    m.y += m.vy;
    m.rot += m.vr;
    if (m.y > H + 40) { meteors.splice(i, 1); continue; }
    if (dist(ship.x, ship.y, m.x, m.y) < m.r + 12) {
      meteors.splice(i, 1);
      lives--;
      spawnParticles(ship.x, ship.y, '#e74c3c', 18);
      livesEl.textContent = '❤'.repeat(lives);
      if (lives <= 0) {
        spawnParticles(ship.x, ship.y, '#fff', 30);
        gameOver();
      }
    }
  }

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.y += s.vy;
    s.rot += s.vr;
    if (s.y > H + 20) { stars.splice(i, 1); continue; }
    if (dist(ship.x, ship.y, s.x, s.y) < 22) {
      stars.splice(i, 1);
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(s.x, s.y, '#f5c842', 12);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  drawBg();
  for (const s of stars) drawStar(s);
  for (const m of meteors) drawMeteor(m);
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (lives > 0) drawShip(ship.x, ship.y);

  requestAnimationFrame(loop);
}

drawBg();
drawShip(ship.x, ship.y);
</script>

</body>
</html>
