<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星際閃避 Star Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #0a0a0f;
    color: #e8e8e8;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 24px;
  }
  .game-wrap {
    width: 100%;
    max-width: 420px;
    user-select: none;
    -webkit-user-select: none;
  }
  .game-title {
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 2px;
    letter-spacing: 2px;
    color: #fff;
  }
  .game-subtitle {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-bottom: 8px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px 8px;
  }
  .user-btn {
    padding: 4px 10px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a22;
    color: #aaa;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .user-btn:hover { background: #252530; border-color: #555; color: #fff; }
  .user-btn.logged { color: #f5c842; border-color: #444; }
  .game-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
    font-size: 13px;
    color: #999;
  }
  .game-hud b { color: #fff; font-weight: 500; }
  .canvas-wrap {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #222;
    background: #0d0d12;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    touch-action: none;
  }
  .game-btn {
    display: block;
    width: 100%;
    padding: 10px 0;
    margin-top: 10px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a22;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }
  .game-btn:hover { background: #252530; border-color: #444; }

  .game-over {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 12px 0 4px;
  }
  .game-over .score-block {
    text-align: center;
    color: #888;
    font-size: 13px;
  }
  .game-over .score-block .big {
    font-size: 32px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 2px;
  }
  .game-over .score-block .label { color: #666; }

  .side-btn {
    padding: 8px 14px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a22;
    color: #ccc;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    white-space: nowrap;
  }
  .side-btn:hover {
    background: #252530;
    border-color: #555;
    color: #fff;
  }

  .ad-banner {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px dashed #333;
    border-radius: 8px;
    background: #111118;
    text-align: center;
    color: #555;
    font-size: 12px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ad-banner .ad-label {
    font-size: 10px;
    color: #444;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer-legal {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #1a1a22;
    font-size: 11px;
    color: #444;
    line-height: 1.7;
    text-align: center;
  }
  .footer-legal a {
    color: #666;
    text-decoration: none;
  }
  .footer-legal a:hover {
    color: #888;
    text-decoration: underline;
  }
  .footer-legal .sep {
    color: #333;
    margin: 0 6px;
  }

  /* 彈窗 */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #15151a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 360px;
    text-align: center;
  }
  .modal-box h3 {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 16px;
  }
  .modal-box p {
    font-size: 13px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .modal-input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #0d0d12;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .modal-input:focus { border-color: #555; }
  .modal-input::placeholder { color: #555; }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-btn {
    padding: 8px 18px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a22;
    color: #ccc;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .modal-btn:hover { background: #252530; color: #fff; }
  .modal-btn.primary { border-color: #444; color: #fff; }
  .modal-btn.primary:hover { background: #2a2a35; }

  /* 排行榜 */
  .leaderboard-list {
    max-height: 220px;
    overflow-y: auto;
    margin: 12px 0;
    text-align: left;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid #1a1a22;
    font-size: 13px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 28px;
    color: #666;
    font-weight: 500;
  }
  .lb-rank.top { color: #f5c842; }
  .lb-name { flex: 1; color: #ccc; padding-left: 8px; }
  .lb-score { color: #fff; font-weight: 500; }
  .lb-empty {
    text-align: center;
    color: #555;
    padding: 16px 0;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="game-title">🚀 星際閃避</div>
  <div class="game-subtitle">Star Dodge — 全方位閃躲，四面來襲！</div>

  <div class="top-bar">
    <div class="game-hud" style="padding:0;flex:1;">
      <span>分數: <b id="score">0</b></span>
      <span>生命: <b id="lives">❤❤❤</b></span>
    </div>
    <button class="user-btn" id="userBtn" onclick="openLogin()">👤 登入</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="420" height="480"></canvas>
  </div>
  <button class="game-btn" id="btn" onclick="startGame()">開始遊戲</button>

  <div class="game-over" id="over" style="display:none">
    <button class="side-btn" onclick="openSettings()">⚙️ 設定</button>
    <div class="score-block">
      <div class="big" id="final">0</div>
      <div class="label">最終得分</div>
    </div>
    <button class="side-btn" onclick="openRewards()">🏆 獎勵</button>
  </div>

  <div class="ad-banner">
    <div>
      <div class="ad-label">Advertisement</div>
      <div>廣告位招租 — 聯繫我們</div>
    </div>
  </div>

  <div class="footer-legal">
    <div>© 2026 星際閃避 Star Dodge. 保留所有權利。</div>
    <div>
      <a href="#">版權聲明</a>
      <span class="sep">|</span>
      <a href="#">法律責任</a>
      <span class="sep">|</span>
      <a href="#">隱私政策</a>
    </div>
    <div style="margin-top:4px; color:#333;">本網站內容僅供娛樂用途，作者不承擔任何因使用本網站而產生的法律責任。</div>
  </div>
</div>

<!-- 登入彈窗 -->
<div class="modal-overlay" id="modal-login">
  <div class="modal-box">
    <h3>👤 用戶登入</h3>
    <p>輸入你的玩家名稱，分數將記錄至排行榜</p>
    <input type="text" class="modal-input" id="loginInput" placeholder="輸入用戶名..." maxlength="12">
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('modal-login')">取消</button>
      <button class="modal-btn primary" onclick="doLogin()">登入</button>
    </div>
  </div>
</div>

<!-- 設定彈窗 -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal-box">
    <h3>⚙️ 設定</h3>
    <p>音效、難度等設定功能即將推出，敬請期待！</p>
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="closeModal('modal-settings')">關閉</button>
    </div>
  </div>
</div>

<!-- 獎勵/排行榜彈窗 -->
<div class="modal-overlay" id="modal-rewards">
  <div class="modal-box">
    <h3>🏆 排行榜</h3>
    <div class="leaderboard-list" id="lbList">
      <div class="lb-empty">暫無記錄，快來玩一局吧！</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="clearLeaderboard()">清除記錄</button>
      <button class="modal-btn primary" onclick="closeModal('modal-rewards')">關閉</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const btn = document.getElementById('btn');
const over = document.getElementById('over');
const finalEl = document.getElementById('final');
const userBtn = document.getElementById('userBtn');
const loginInput = document.getElementById('loginInput');
const lbList = document.getElementById('lbList');

const W = 420, H = 480;

let state = 'menu';
let score = 0;
let lives = 3;
let frame = 0;
let ship = { x: W/2, y: H/2, w: 28, h: 32 };
let meteors = [];
let stars = [];
let particles = [];
let bgStars = [];
let spawnRate = 55;
let speedMult = 1;

let username = localStorage.getItem('starDodgeUser') || '';
let leaderboard = JSON.parse(localStorage.getItem('starDodgeLB') || '[]');

updateUserBtn();

for (let i = 0; i < 50; i++) {
  bgStars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() * 1.5 + 0.5,
    a: Math.random() * 0.6 + 0.2
  });
}

function updateUserBtn() {
  if (username) {
    userBtn.textContent = '👤 ' + username;
    userBtn.classList.add('logged');
  } else {
    userBtn.textContent = '👤 登入';
    userBtn.classList.remove('logged');
  }
}

function openLogin() {
  if (username) {
    if (confirm('目前登入為「' + username + '」，要登出或更換用戶嗎？')) {
      username = '';
      localStorage.removeItem('starDodgeUser');
      updateUserBtn();
    }
    return;
  }
  loginInput.value = '';
  document.getElementById('modal-login').classList.add('active');
  setTimeout(() => loginInput.focus(), 100);
}

function doLogin() {
  const name = loginInput.value.trim();
  if (!name) { alert('請輸入用戶名'); return; }
  if (name.length > 12) { alert('用戶名最多12個字'); return; }
  username = name;
  localStorage.setItem('starDodgeUser', username);
  updateUserBtn();
  closeModal('modal-login');
}

loginInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function openSettings() {
  document.getElementById('modal-settings').classList.add('active');
}

function openRewards() {
  renderLeaderboard();
  document.getElementById('modal-rewards').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderLeaderboard() {
  if (leaderboard.length === 0) {
    lbList.innerHTML = '<div class="lb-empty">暫無記錄，快來玩一局吧！</div>';
    return;
  }
  const sorted = leaderboard.slice().sort((a, b) => b.score - a.score);
  let html = '';
  sorted.forEach((entry, i) => {
    const rankClass = i < 3 ? 'top' : '';
    const medal = i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '';
    html += '<div class="lb-row">' +
      '<span class="lb-rank ' + rankClass + '">#' + (i + 1) + '</span>' +
      '<span class="lb-name">' + medal + escapeHtml(entry.name) + '</span>' +
      '<span class="lb-score">' + entry.score + '</span>' +
      '</div>';
  });
  lbList.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function clearLeaderboard() {
  if (!confirm('確定要清除所有排行榜記錄嗎？')) return;
  leaderboard = [];
  localStorage.removeItem('starDodgeLB');
  renderLeaderboard();
}

function saveScore() {
  if (!username || score <= 0) return;
  leaderboard.push({ name: username, score: score, date: Date.now() });
  localStorage.setItem('starDodgeLB', JSON.stringify(leaderboard));
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === e.currentTarget) el.classList.remove('active');
  });
});

function reset() {
  score = 0; lives = 3; frame = 0;
  ship.x = W/2; ship.y = H/2;
  meteors = []; stars = []; particles = [];
  spawnRate = 55; speedMult = 1;
  scoreEl.textContent = '0';
  livesEl.textContent = '❤❤❤';
  over.style.display = 'none';
  btn.style.display = 'block';
  btn.textContent = '重新開始';
}

function startGame() {
  reset();
  state = 'play';
  btn.style.display = 'none';
  loop();
}

function gameOver() {
  state = 'over';
  finalEl.textContent = score;
  saveScore();
  over.style.display = 'flex';
  btn.style.display = 'block';
  btn.textContent = '再玩一次';
}

let mx = W/2, my = H/2;

function updateMouse(e) {
  const r = canvas.getBoundingClientRect();
  mx = (e.clientX - r.left) * (W / r.width);
  my = (e.clientY - r.top) * (H / r.height);
}

canvas.addEventListener('mousemove', updateMouse);
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mx = (e.touches[0].clientX - r.left) * (W / r.width);
  my = (e.touches[0].clientY - r.top) * (H / r.height);
}, { passive: false });

function spawnMeteor() {
  const r = 12 + Math.random() * 14;
  let x, y, vx, vy;
  const side = Math.floor(Math.random() * 4);
  const speed = 1.5 + Math.random() * 2 + speedMult * 0.6;

  switch(side) {
    case 0:
      x = Math.random() * W; y = -r - 10;
      vx = (Math.random() - 0.5) * 2; vy = speed;
      break;
    case 1:
      x = W + r + 10; y = Math.random() * H;
      vx = -speed; vy = (Math.random() - 0.5) * 2;
      break;
    case 2:
      x = Math.random() * W; y = H + r + 10;
      vx = (Math.random() - 0.5) * 2; vy = -speed;
      break;
    case 3:
      x = -r - 10; y = Math.random() * H;
      vx = speed; vy = (Math.random() - 0.5) * 2;
      break;
  }

  const m = { x, y, r, vx, vy, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.08, pts: [] };
  const n = 7 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const rr = m.r * (0.7 + Math.random() * 0.3);
    m.pts.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr });
  }
  meteors.push(m);
}

function spawnStar() {
  let x, y, vx, vy;
  const side = Math.floor(Math.random() * 4);
  const speed = 1 + Math.random() * 1.2;

  switch(side) {
    case 0:
      x = Math.random() * W; y = -20;
      vx = (Math.random() - 0.5) * 1.5; vy = speed;
      break;
    case 1:
      x = W + 20; y = Math.random() * H;
      vx = -speed; vy = (Math.random() - 0.5) * 1.5;
      break;
    case 2:
      x = Math.random() * W; y = H + 20;
      vx = (Math.random() - 0.5) * 1.5; vy = -speed;
      break;
    case 3:
      x = -20; y = Math.random() * H;
      vx = speed; vy = (Math.random() - 0.5) * 1.5;
      break;
  }

  stars.push({ x, y, vx, vy, rot: Math.random() * Math.PI * 2, vr: 0.03 });
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function dist(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  const flicker = 4 + Math.random() * 6;
  ctx.fillStyle = '#f5a623';
  ctx.beginPath();
  ctx.moveTo(-6, 12);
  ctx.lineTo(0, 12 + flicker);
  ctx.lineTo(6, 12);
  ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(-3, 12);
  ctx.lineTo(0, 12 + flicker * 0.6);
  ctx.lineTo(3, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(-12, 12);
  ctx.lineTo(-6, 10);
  ctx.lineTo(0, 14);
  ctx.lineTo(6, 10);
  ctx.lineTo(12, 12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(0, -2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.fillStyle = '#555';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(m.pts[0].x, m.pts[0].y);
  for (let i = 1; i < m.pts.length; i++) ctx.lineTo(m.pts[i].x, m.pts[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.arc(m.pts[0].x * 0.3, m.pts[0].y * 0.3, m.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const a2 = ((i + 0.5) / 4) * Math.PI * 2 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
    ctx.lineTo(Math.cos(a2) * 4, Math.sin(a2) * 4);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (const s of bgStars) {
    ctx.globalAlpha = s.a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
    ctx.fill();
    if (state === 'play') {
      s.x += 0.1 * speedMult;
      s.y += 0.1 * speedMult;
      if (s.x > W) s.x = 0;
      if (s.y > H) s.y = 0;
    }
  }
  ctx.globalAlpha = 1;
}

function loop() {
  if (state !== 'play') {
    drawBg();
    drawShip(ship.x, ship.y);
    return;
  }
  frame++;
  if (frame % 300 === 0) {
    spawnRate = Math.max(18, spawnRate - 2);
    speedMult += 0.08;
  }
  if (frame % Math.floor(spawnRate) === 0) spawnMeteor();
  if (frame % 120 === 0) spawnStar();

  ship.x += (mx - ship.x) * 0.1;
  ship.y += (my - ship.y) * 0.1;
  ship.x = Math.max(14, Math.min(W - 14, ship.x));
  ship.y = Math.max(14, Math.min(H - 14, ship.y));

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx;
    m.y += m.vy;
    m.rot += m.vr;
    if (m.x < -60 || m.x > W + 60 || m.y < -60 || m.y > H + 60) {
      meteors.splice(i, 1);
      continue;
    }
    if (dist(ship.x, ship.y, m.x, m.y) < m.r + 12) {
      meteors.splice(i, 1);
      lives--;
      spawnParticles(ship.x, ship.y, '#e74c3c', 18);
      livesEl.textContent = '❤'.repeat(lives);
      if (lives <= 0) {
        spawnParticles(ship.x, ship.y, '#fff', 30);
        gameOver();
      }
    }
  }

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.rot += s.vr;
    if (s.x < -40 || s.x > W + 40 || s.y < -40 || s.y > H + 40) {
      stars.splice(i, 1);
      continue;
    }
    if (dist(ship.x, ship.y, s.x, s.y) < 22) {
      stars.splice(i, 1);
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(s.x, s.y, '#f5c842', 12);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  drawBg();
  for (const s of stars) drawStar(s);
  for (const m of meteors) drawMeteor(m);
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (lives > 0) drawShip(ship.x, ship.y);

  requestAnimationFrame(loop);
}

drawBg();
drawShip(ship.x, ship.y);
</script>
